<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>보장분석 자동화</title>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

  <style>

    body{
      font-family:sans-serif;
      padding:20px;
      background:#f5f5f5;
    }

    h2{
      margin-top:30px;
    }

    input{
      width:100%;
      height:45px;
      margin-bottom:20px;
      padding:10px;
      font-size:16px;
      box-sizing:border-box;
    }

    textarea{
      width:100%;
      height:160px;
      margin-bottom:20px;
      padding:10px;
      font-size:15px;
      box-sizing:border-box;
      resize:none;
    }

    button{
      width:100%;
      height:55px;
      font-size:18px;
      border:none;
      background:#111;
      color:white;
      cursor:pointer;
    }

  </style>
</head>
<body>

  <h1>보장분석 자동화</h1>

  <input type="text" id="fileCustomerName" placeholder="다운로드 파일명">

  <input type="text" id="excelCustomerName" placeholder="엑셀 고객명">
  <input type="number" id="customerAge" placeholder="나이 입력">
  <input type="text" id="customerGender" placeholder="성별 입력 (남/여)">

  <h2>보험1</h2>
  <textarea id="insurance1"></textarea>

  <h2>보험2</h2>
  <textarea id="insurance2"></textarea>

  <h2>보험3</h2>
  <textarea id="insurance3"></textarea>

  <h2>보험4</h2>
  <textarea id="insurance4"></textarea>

  <h2>보험5</h2>
  <textarea id="insurance5"></textarea>

  <h2>보험6</h2>
  <textarea id="insurance6"></textarea>

  <h2>보험7</h2>
  <textarea id="insurance7"></textarea>

  <h2>보험8</h2>
  <textarea id="insurance8"></textarea>

  <button id="downloadBtn">
    엑셀 다운로드
  </button>

  <script src="./js/script.js"></script>

</body>
</html>
